name: Dragon Bot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          find commands lib handlers tests -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check index.js
      - name: Run game tests
        run: npm test
